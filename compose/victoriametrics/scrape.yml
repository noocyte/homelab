# What VictoriaMetrics fetches itself (Prometheus-style scraping).
# Re-read every minute (-promscrape.configCheckInterval), so a change here
# only needs the git pull that homelab-gitops does - no restart.
scrape_configs:
  - job_name: unpoller
    scrape_interval: 30s        # UniFi updates its counters about every 30 s
    static_configs:
      - targets: ["192.168.0.240:9130"]

  - job_name: pihole
    scrape_interval: 30s
    static_configs:
      - targets: ["192.168.0.240:9617"]

  # Proxmox via pve-exporter: the exporter is at .240:9221, the Proxmox host
  # to ask is passed as ?target=.
  - job_name: pve
    scrape_interval: 30s
    metrics_path: /pve
    params:
      cluster: ["1"]
      node: ["1"]
    static_configs:
      - targets: ["192.168.0.107"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 192.168.0.240:9221
