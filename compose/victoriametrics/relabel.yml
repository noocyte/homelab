# Applied to everything VictoriaMetrics receives (-relabelConfig).
# Read at startup: a change here restarts the container (config_files in
# komodo/sync/stacks.toml).

# Home Assistant's InfluxDB integration sends every attribute of every sensor
# as its own series (friendly_name_str, icon_str, min, max, ...). Keep only
# the sensor values: <domain>__<device_class>_value, e.g.
# sensor__temperature_value{entity_id="..."}.
- action: drop
  if: '{db="homeassistant", __name__!~".+_value"}'
