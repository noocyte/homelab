# VictoriaMetrics: long-term time series from Home Assistant (energy,
# temperatures - numbers only) and UniFi network statistics (scraped from
# unpoller, see scrape.yml). HA writes with its built-in InfluxDB
# integration (Influx line protocol on :8428/write), Grafana reads it as a
# Prometheus data source. See README → "Home Assistant history".
#
# Data:   /srv/victoriametrics (kept forever; ~1 byte per value)
# Backup: vmbackup at 02:50 → /mnt/backups/victoriametrics/latest (ZFS),
#         incremental (only changed parts are copied); the backup stack
#         mirrors it to Jottacloud at 03:00.
# Restore: stop victoriametrics, then
#   docker run --rm -v /srv/victoriametrics:/storage -v /mnt/backups/victoriametrics:/backups \
#     victoriametrics/vmrestore:v1.155.0 -src=fs:///backups/latest -storageDataPath=/storage
# and start it again.
services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.155.0
    restart: unless-stopped
    ports:
      - 8428:8428
    volumes:
      - /srv/victoriametrics:/storage
      - .:/scripts:ro                          # scrape.yml, relabel.yml
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=100y                  # i.e. keep everything
      - -promscrape.config=/scripts/scrape.yml # UniFi via unpoller
      - -promscrape.configCheckInterval=1m
      - -relabelConfig=/scripts/relabel.yml    # drop HA attribute noise
      # Identical samples (same series + timestamp) are stored once, so
      # imports/backfills can safely be re-run.
      - -dedup.minScrapeInterval=1ms

  # Idle; Ofelia runs vmbackup in it nightly. vmbackup asks victoriametrics
  # for a snapshot, copies what changed since the last run, and deletes the
  # snapshot again. Refuses to run if the ZFS share isn't mounted.
  vmbackup:
    image: victoriametrics/vmbackup:v1.155.0
    restart: unless-stopped
    entrypoint: ["sleep", "infinity"]
    volumes:
      - /srv/victoriametrics:/storage:ro
      - /mnt/backups/victoriametrics:/backups  # ZFS share (NFS)
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.victoriametrics-backup.schedule: "0 50 2 * * *"
      ofelia.job-exec.victoriametrics-backup.command: >-
        sh -c 'grep -q " /backups nfs" /proc/mounts || { echo "/backups is not the NFS share, aborting" >&2; exit 1; };
        /vmbackup-prod -storageDataPath=/storage -dst=fs:///backups/latest
        -snapshot.createURL=http://victoriametrics:8428/snapshot/create'
