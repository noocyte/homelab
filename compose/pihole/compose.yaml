# Pi-hole: network-wide DNS + ad blocking. DNS only (DHCP stays in UniFi).
#
# All settings are declared here as FTLCONF_* variables (Pi-hole v6), so a
# rebuild gives the same config. Blocklists / allow-lists live in lists.sh,
# which Komodo runs after each deploy.
#
# Secret (Komodo): PIHOLE_ADMIN_PASSWORD
#
# pihole-exporter publishes Pi-hole's statistics on :9617/metrics for
# VictoriaMetrics (compose/victoriametrics/scrape.yml). Dashboard: Grafana
# folder "Pi-hole".

services:
  pihole:
    image: pihole/pihole:2026.10.1
    container_name: pihole
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80/tcp"
    environment:
      TZ: Europe/Oslo
      FTLCONF_webserver_api_password: ${PIHOLE_ADMIN_PASSWORD}
      # Answer queries from the LAN (default only answers "local" subnets,
      # which under Docker's bridge network means the container network).
      FTLCONF_dns_listeningMode: ALL
      # Cloudflare for Families (malware + adult content), two addresses.
      # IPv4 only: Docker on docker-host has no IPv6, so IPv6 upstreams fail.
      FTLCONF_dns_upstreams: "1.1.1.3;1.0.0.3"
      FTLCONF_dns_domain_name: home.lan
      FTLCONF_dns_hosts: "192.168.0.240 docker-host.home.lan;192.168.0.107 proxmox.home.lan;192.168.0.63 ha.home.lan;192.168.0.220 smb.home.lan"
      FTLCONF_dns_cnameRecords: "homeassistant.local,ha.home.lan"
    volumes:
      - /srv/pihole/etc-pihole:/etc/pihole

  pihole-exporter:
    # v1.x speaks Pi-hole v6's API. Pinned; upgrade deliberately.
    image: ekofr/pihole-exporter:v1.3.1
    restart: unless-stopped
    depends_on:
      - pihole
    ports:
      - "9617:9617"
    environment:
      PIHOLE_HOSTNAME: pihole       # service name on this stack's network
      PIHOLE_PORT: "80"             # inside the container, not the published 8080
      PIHOLE_PASSWORD: ${PIHOLE_ADMIN_PASSWORD}
      PORT: "9617"
