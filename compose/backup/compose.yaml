# Nightly offsite backup (rclone → Jottacloud, encrypted), scheduled by Ofelia.
#
# Host paths:
#   /srv/rclone/rclone.conf   rclone config incl. crypt password (restore from password manager)
#   /srv/rclone/status/       backup-status.sh state (last good Jotta sync per folder, alerts sent)
#   /mnt/immich               Immich library (virtiofs, read-only)
#   /mnt/backups              ZFS backups share on Proxmox (NFS). Every service
#                             writes its own backups there, one folder each:
#     komodo/            Komodo DB (01:00, Komodo procedure)
#     teslamate/         pg_dumps (02:30, compose/teslamate/dump.sh)
#     trip-planner/      DB copy + attachments (02:45, compose/trip-planner/backup-db.py)
#     victoriametrics/   vmbackup, incremental (02:50, compose/victoriametrics)
#     homeassistant/     HA backups (~05:30, HA network storage "NASBACKUP", NFS)
#     proxmox/           vzdump images (Sun 01:00) + host config (01:30), see proxmox/
#     onedrive/<name>/   personal OneDrive copies (02:00, onedrive.sh, below)
#     crafty/            nightly/ (02:40, compose/crafty/backup.py) + Crafty's own server-backups/
#   /srv/rclone-onedrive/rclone.conf   OneDrive logins (remotes onedrive-<name>)
#   /mnt/archive              personal archive (old NAS: KNX project, code, configs), read-only
#
# backup.sh is mounted via its folder: Komodo clones this repo onto the host
# under /etc/komodo/stacks/, so ./backup.sh exists on the host.

services:
  ofelia:
    image: mcuadros/ofelia:0.3.22
    container_name: backup-scheduler
    command: daemon --docker
    restart: unless-stopped
    environment:
      - TZ=Europe/Oslo
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  rclone-backup:
    image: rclone/rclone:1
    container_name: rclone-backup
    entrypoint: ["sleep", "infinity"]   # idle; Ofelia execs the job in
    restart: unless-stopped
    environment:
      - RCLONE_CONFIG=/config/rclone.conf
      - TZ=Europe/Oslo
      # 100 Mbit/s (12 MiB/s) 06:00-00:00, full speed at night - so big
      # first copies don't slow the house's internet in the daytime.
      - RCLONE_BWLIMIT=06:00,12M 00:00,off
      # backup-status.sh: HA webhook (Komodo secret, local-only webhook in HA).
      - HA_WEBHOOK_URL=${HA_BACKUP_WEBHOOK:-}
      - VM_URL=http://192.168.0.240:8428
    volumes:
      - /srv/rclone:/config                   # RW: rclone refreshes the Jottacloud token
      - /mnt/immich:/sources/immich:ro
      - /mnt/backups:/sources/backups:ro
      - /mnt/archive:/sources/archive:ro
      # Folder, not single file: a single-file bind mount keeps pointing at the
      # old file after git pull replaces it.
      - .:/scripts:ro
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.nightly.schedule: "0 0 3 * * *"   # 03:00 daily
      ofelia.job-exec.nightly.command: "sh /scripts/backup.sh"
      # Status → VictoriaMetrics (Grafana "Backups") + Home Assistant alerts.
      ofelia.job-exec.backup-status.schedule: "0 */15 * * * *"
      ofelia.job-exec.backup-status.command: "sh /scripts/backup-status.sh"

  # Nightly one-way copy of personal OneDrive accounts (onedrive.sh). Its
  # own container and config: it can write only to /mnt/backups/onedrive,
  # and holds only the OneDrive logins. Add an account: see README →
  # "OneDrive copies".
  rclone-onedrive:
    image: rclone/rclone:1
    container_name: rclone-onedrive
    entrypoint: ["sleep", "infinity"]   # idle; Ofelia execs the job in
    restart: unless-stopped
    environment:
      - RCLONE_CONFIG=/config/rclone.conf
      - TZ=Europe/Oslo
      # 100 Mbit/s (12 MiB/s) 06:00-00:00, full speed at night - so big
      # first copies don't slow the house's internet in the daytime.
      - RCLONE_BWLIMIT=06:00,12M 00:00,off
    volumes:
      - /srv/rclone-onedrive:/config          # RW: rclone refreshes the OneDrive tokens
      - /mnt/backups/onedrive:/onedrive
      - .:/scripts:ro
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.onedrive.schedule: "0 0 2 * * *"   # 02:00 daily
      ofelia.job-exec.onedrive.command: "sh /scripts/onedrive.sh"
