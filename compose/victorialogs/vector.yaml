# Vector: collects all logs and sends them to VictoriaLogs in ONE schema.
#
#   host       docker-host | pve | homeassistant | UCGULT
#   service    compose project | container or systemd unit | syslog app ("unifi" for CEF)
#   container  container name (docker-host, and HA OS add-ons/core)
#   level      debug | info | notice | warning | error | critical | unknown
#   source     docker | journald | syslog
#   message    the text (ANSI colour codes stripped)
#
# Streams: host, service, container. Everything else is a normal field.
# Examples: `service:pihole`, `host:pve level:error`, `service:unifi event:*`.
#
# Inputs:
#   docker   every container on docker-host (Docker API, socket read-only).
#            Only logs written after Vector starts (no backfill).
#   syslog   5514/udp: UniFi. CEF is unpacked (event, unifi.*).
#   journal  6000/tcp: Vector on the Proxmox host (proxmox/vector.yaml) and
#            on Home Assistant OS (homeassistant/vector.yaml) forward their
#            journals; disk-buffered there, so nothing is lost while
#            docker-host is down.

sources:
  docker:
    type: docker_logs
    # Vector's own output stays out, so it never logs about shipping itself.
    exclude_containers:
      - victorialogs-vector

  syslog:
    type: socket
    mode: udp
    address: 0.0.0.0:5514

  journal:
    type: vector
    address: 0.0.0.0:6000

transforms:
  docker_norm:
    type: remap
    inputs: [docker]
    source: |
      . = {
        "timestamp": .timestamp,
        "message": replace(string(.message) ?? "", r'\x1b\[[0-9;]*[A-Za-z]', ""),
        "host": "docker-host",
        "service": .label."com.docker.compose.project" || .container_name,
        "container": .container_name,
        "image": .image,
        "stream": .stream,
        "source": "docker"
      }

  # Komodo's database chatter: ~19k lines/hour of routine success messages.
  # Errors and everything else from these containers are kept.
  drop_noise:
    type: filter
    inputs: [docker_norm]
    condition: |
      m = string!(.message)
      ferret_ok = .container == "komodo-ferretdb-1" && contains(m, "\tINFO\t") && contains(m, "Command handled") && contains(m, "\"result\":\"ok\"")
      pg_cron = .container == "komodo-postgres-1" && match(m, r'LOG:  cron job \d+ (starting|COMMAND completed|completed):')
      !ferret_ok && !pg_cron

  syslog_norm:
    type: remap
    inputs: [syslog]
    # Classic (RFC 3164) syslog timestamps carry no time zone.
    timezone: Europe/Oslo
    source: |
      sender = .host
      p, err = parse_syslog(.message)
      if err != null {
        p = {"message": .message, "timestamp": .timestamp, "hostname": sender}
      }
      . = {
        "timestamp": p.timestamp,
        "message": p.message,
        "host": p.hostname || sender,
        "service": p.appname || "syslog",
        "level": p.severity,
        "pid": p.procid,
        "sender_ip": sender,
        "source": "syslog"
      }
      if .service == "CEF" {
        c, err = parse_cef("CEF:" + string!(.message))
        if err == null {
          .service = "unifi"
          .unifi = c
          .message = string(c.msg) ?? string!(c.name)
          .event = c.name
          # UniFi's own UTC time is exact; the syslog header has no zone.
          .timestamp = parse_timestamp(c.UNIFIutcTime, "%+") ?? .timestamp
        }
      }

  journal_norm:
    type: remap
    inputs: [journal]
    source: |
      # journald PRIORITY 0-7 (emerg, alert, crit, err, warning, notice, info, debug)
      levels = {"0": "critical", "1": "critical", "2": "critical", "3": "error", "4": "warning", "5": "notice", "6": "info", "7": "debug"}
      level = get(levels, [string(.PRIORITY) ?? "6"]) ?? "info"
      # Containers (HA OS: core, Supervisor, add-ons) log through Docker's
      # journald driver: PRIORITY is only stdout (6) / stderr (3), and HA Core
      # writes everything to stderr. Leave the level to the text detection.
      if .CONTAINER_NAME != null { level = null }
      . = {
        "timestamp": .timestamp,
        "message": replace(string(.message) ?? "", r'\x1b\[[0-9;]*[A-Za-z]', ""),
        "host": .host,
        "service": .CONTAINER_NAME || ._SYSTEMD_UNIT || .SYSLOG_IDENTIFIER || ._TRANSPORT || "journal",
        "container": .CONTAINER_NAME,
        "level": level,
        "pid": ._PID,
        "command": ._COMM,
        "identifier": .SYSLOG_IDENTIFIER,
        "transport": ._TRANSPORT,
        "source": "journald"
      }

  # HA Core writes multi-line entries (Python tracebacks); the journal has
  # one entry per line. Glue lines that don't start with HA's timestamp onto
  # the entry before, so a traceback stays with its ERROR line.
  journal_split:
    type: route
    inputs: [journal_norm]
    route:
      ha_core: '.host == "homeassistant" && .container == "homeassistant"'

  ha_core_merge:
    type: reduce
    inputs: [journal_split.ha_core]
    group_by: [host, container]
    starts_when: 'match(string(.message) ?? "", r''^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}'')'
    expire_after_ms: 2000
    merge_strategies:
      message: concat_newline

  # One level vocabulary for all sources. Uses the level a source already
  # has (journald, syslog); otherwise looks for it in the text: JSON
  # "level", logfmt level=, an upper-case word (INFO, ▶ NOTICE, [ERROR]),
  # a lower-case "info:"/"warning:" prefix (s6-rc: info: ...), or
  # Postgres' LOG:.
  levels:
    type: remap
    inputs: [drop_noise, syslog_norm, journal_split._unmatched, ha_core_merge]
    source: |
      m = string(.message) ?? ""
      head = slice(m, 0, 200) ?? m
      l = .level
      if l == null {
        j, err = parse_json(m)
        if err == null && is_object(j) {
          l = j.level || j.lvl || j.severity
        }
      }
      if l == null {
        f = parse_regex(head, r'(?i)\b(?:level|lvl|severity)=["]?(?P<l>[a-z]+)') ?? {}
        l = f.l
      }
      if l == null {
        f = parse_regex(head, r'\b(?P<l>TRACE|DEBUG|INFO|NOTICE|WARN|WARNING|ERROR|ERR|FATAL|CRIT|CRITICAL|PANIC|Info|Warning|Error)\b') ?? {}
        l = f.l
      }
      if l == null {
        f = parse_regex(head, r'(?:^|[\s:\]])(?P<l>debug|info|notice|warning|warn|error|fatal|critical):\s') ?? {}
        l = f.l
      }
      if l == null && contains(head, "LOG:") { l = "info" }
      l = downcase(string(l) ?? "unknown")
      .level = if includes(["trace", "debug", "dbug"], l) { "debug" }
        else if includes(["info", "informational", "log", "inf"], l) { "info" }
        else if l == "notice" { "notice" }
        else if includes(["warn", "warning", "wrn"], l) { "warning" }
        else if includes(["error", "err", "eror"], l) { "error" }
        else if includes(["fatal", "crit", "critical", "panic", "alert", "emerg", "emergency"], l) { "critical" }
        else { "unknown" }

  # Blank lines (e.g. between HA tracebacks) carry nothing.
  not_empty:
    type: filter
    inputs: [levels]
    condition: 'strip_whitespace(string(.message) ?? "") != ""'

sinks:
  victorialogs:
    type: elasticsearch
    inputs: [not_empty]
    endpoints: ["http://victorialogs:9428/insert/elasticsearch/"]
    mode: bulk
    api_version: v8
    compression: gzip
    healthcheck:
      enabled: false
    query:
      _msg_field: message
      _time_field: timestamp
      _stream_fields: host,service,container
