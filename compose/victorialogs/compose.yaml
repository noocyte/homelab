# VictoriaLogs: central logs. Everything arrives via Vector (below), which
# puts all sources into one schema (see vector.yaml): container logs, UniFi
# syslog, and the Proxmox host's journal (from Vector on pve, see
# proxmox/vector.yaml). Query in the built-in UI at
# http://192.168.0.240:9428/select/vmui, or from Grafana.
#
# Data:   /srv/victorialogs. Kept 30 days, capped at 15 GiB (oldest days are
#         dropped first when the cap is hit).
# Backup: none on purpose; logs are only useful for recent troubleshooting.
services:
  victorialogs:
    image: victoriametrics/victoria-logs:v1.53.0
    restart: unless-stopped
    ports:
      - 9428:9428          # HTTP: ingestion, queries, vmui
    volumes:
      - /srv/victorialogs:/storage
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=30d
      - -retention.maxDiskSpaceUsageBytes=15GiB

  # Ships all container logs (Docker API, socket read-only), syslog (UniFi,
  # 5514/udp) and the pve journal (6000/tcp) to victorialogs. Config: vector.yaml (read at startup).
  vector:
    image: timberio/vector:0.60.0-alpine
    restart: unless-stopped
    depends_on: [victorialogs]
    ports:
      - 5514:5514/udp      # syslog (UniFi)
      - 6000:6000          # Vector protocol (journal from Vector on pve)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - .:/etc/vector:ro                        # vector.yaml
