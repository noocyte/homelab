# Mosquitto 2 only listens on localhost and refuses anonymous clients unless
# told otherwise. Clients: TeslaMate, teslamate-abrp, saic2postgresql (Docker
# network) and, from the HA host (192.168.0.63), HA's MQTT integration and
# saic-python-mqtt-gateway. None of them log in, so: all interfaces, anonymous.
# LAN only (port 1883 is not forwarded).
listener 1883
allow_anonymous true
