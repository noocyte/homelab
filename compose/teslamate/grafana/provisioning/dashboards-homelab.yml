# Our own Grafana dashboards, loaded from git (../dashboards/<folder>/*.json).
# Git is the source of truth: Grafana refuses to save changes to them.
# To change one: edit in Grafana → Save → "Copy JSON to clipboard", paste it
# into the file in compose/teslamate/grafana/dashboards/, and merge.
# New dashboard: add the JSON file (unique "uid", no "id") and list it under
# config_files for teslamate in komodo/sync/stacks.toml.
apiVersion: 1

providers:
  - name: homelab
    orgId: 1
    folder: ""                 # General, where "Visited - All Cars" always was
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /homelab-dashboards/general

  # UnPoller's official Prometheus dashboards (grafana.com 11311-11315),
  # data source set to VictoriaMetrics.
  - name: homelab-unifi
    orgId: 1
    folder: UniFi
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /homelab-dashboards/unifi

  # pihole-exporter's official dashboard (grafana.com 10176).
  - name: homelab-pihole
    orgId: 1
    folder: Pi-hole
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /homelab-dashboards/pihole

  # prometheus-pve-exporter's dashboard "Proxmox via Prometheus" (grafana.com 10347),
  # "Node Exporter Full" (grafana.com 1860, rev 46) for the host's node-exporter,
  # and our own "Proxmox hardware: temperatures and SMART".
  - name: homelab-proxmox
    orgId: 1
    folder: Proxmox
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /homelab-dashboards/proxmox

  # Energy dashboards built from Home Assistant data (Tibber Pulse, Nord Pool,
  # Easee, outdoor temperature) in VictoriaMetrics.
  - name: homelab-energy
    orgId: 1
    folder: Energy
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /homelab-dashboards/energy

  # Backup status (compose/backup/backup-status.sh → VictoriaMetrics).
  - name: homelab-backups
    orgId: 1
    folder: Backups
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /homelab-dashboards/backups
