# TeslaMate + friends. VALUABLE DATA: Postgres in /srv/teslamate/postgres
# (databases: teslamate, mg_ismart).
#
# Versions are pinned to what ran on serverlite at migration time, so the
# restored database matches the app. Upgrade deliberately, after a backup.
#
# Secrets (Komodo):
#   TESLAMATE_ENCRYPTION_KEY   MUST be the old key, or stored Tesla tokens can't be decrypted
#   TESLAMATE_DB_PASS
#   TESLAMATE_TIBBER_TOKEN
#   TESLAMATE_ABRP_TOKEN
#   TESLAMATE_SAIC_TOPIC_PREFIX
#   TESLAMATE_SAIC_DB_URI
#
# Host paths:
#   /srv/teslamate/postgres            database
#   /srv/teslamate/grafana             grafana state
#   /srv/teslamate/mosquitto/{config,data}
#   /srv/teslamate/import              TeslaFi import folder
#   /srv/teslamate/osrm-data           preprocessed Norway map (see osrm-setup.sh)
#   /srv/teslamate/custom-dashboards   git clone of jheredianet/Teslamate-CustomGrafanaDashboards
#
# Grafana dashboards we made ourselves live in git: grafana/dashboards/.
#   /mnt/backups/teslamate             nightly pg_dumps (ZFS, 14 days) - see dump.sh

services:
  teslamate:
    image: teslamate/teslamate:4.4.0
    restart: always
    environment:
      - ENCRYPTION_KEY=${TESLAMATE_ENCRYPTION_KEY}
      - DATABASE_USER=teslamate
      - DATABASE_PASS=${TESLAMATE_DB_PASS}
      - DATABASE_NAME=teslamate
      - DATABASE_HOST=database
      - MQTT_HOST=mosquitto
      - TZ=Europe/Oslo
    ports:
      - 4000:4000
    volumes:
      - /srv/teslamate/import:/opt/app/import
    cap_drop:
      - all

  teslamateagile:
    # v1.23.0. Moved from Docker Hub mattjeanes/teslamateagile (deprecated in v1.21.0).
    image: ghcr.io/amyjeanes/teslamateagile:v1.23.0@sha256:5e6b18c1bec197ea2afdcc5feafc876c3eb0040f168e985fd2031c2371abdf1d
    restart: always
    environment:
      - DATABASE_USER=teslamate
      - DATABASE_PASS=${TESLAMATE_DB_PASS}
      - DATABASE_NAME=teslamate
      - DATABASE_HOST=database
      - TeslaMate__UpdateIntervalSeconds=300
      - TeslaMate__GeofenceId=1
      - TeslaMate__EnergyProvider=Tibber
      - Tibber__AccessToken=${TESLAMATE_TIBBER_TOKEN}
      - TeslaMate__FeePerKilowattHour=0.40
      # One line per log entry (default .NET output puts the text on a second
      # line without a level), so Vector/VictoriaLogs see "info: … text".
      - Logging__Console__FormatterName=simple
      - Logging__Console__FormatterOptions__SingleLine=true

  database:
    image: postgres:17
    restart: always
    environment:
      - POSTGRES_USER=teslamate
      - POSTGRES_PASSWORD=${TESLAMATE_DB_PASS}
      - POSTGRES_DB=teslamate
    volumes:
      - /srv/teslamate/postgres:/var/lib/postgresql/data
      - /mnt/backups/teslamate:/backups        # ZFS share (NFS)
      - .:/scripts:ro                          # dump.sh
    labels:
      # Nightly dump to ZFS at 02:30; the backup stack ships it offsite at 03:00.
      ofelia.enabled: "true"
      ofelia.job-exec.teslamate-dump.schedule: "0 30 2 * * *"
      ofelia.job-exec.teslamate-dump.command: "sh /scripts/dump.sh"

  grafana:
    image: teslamate/grafana:4.4.0
    restart: always
    environment:
      - DATABASE_USER=teslamate
      - DATABASE_PASS=${TESLAMATE_DB_PASS}
      - DATABASE_NAME=teslamate
      - DATABASE_HOST=database
      # The image only runs GF_INSTALL_PLUGINS with _FORCE=true (and disables
      # Grafana's own preinstall). Re-installs on every start; if grafana.com
      # is unreachable, Grafana fails to start and restart: always retries.
      - GF_INSTALL_PLUGINS=grafana-clock-panel,natel-discrete-panel,grafana-piechart-panel,victoriametrics-logs-datasource 0.33.1
      - GF_INSTALL_PLUGINS_FORCE=true
    ports:
      - 3000:3000
    volumes:
      - /srv/teslamate/grafana:/var/lib/grafana
      - /srv/teslamate/custom-dashboards/customdashboards.yml:/etc/grafana/provisioning/dashboards/customdashboards.yml:ro
      - /srv/teslamate/custom-dashboards/dashboards:/TeslamateCustomDashboards:ro
      # Our own dashboards + MG4 data source, from git (see grafana/provisioning/).
      # The .yml files are single-file mounts: a restart re-reads them after a
      # git pull (config_files in stacks.toml does that).
      - ./grafana/provisioning/dashboards-homelab.yml:/etc/grafana/provisioning/dashboards/homelab.yml:ro
      - ./grafana/provisioning/datasources-homelab.yml:/etc/grafana/provisioning/datasources/homelab.yml:ro
      - ./grafana/dashboards:/homelab-dashboards:ro

  abrp:
    container_name: TeslaMate_ABRP
    image: fetzu/teslamate-abrp:4.0.2
    restart: always
    depends_on:
      - database
      - mosquitto
    environment:
      - MQTT_SERVER=mosquitto
      - USER_TOKEN=${TESLAMATE_ABRP_TOKEN}
      - CAR_NUMBER=2

  mosquitto:
    image: eclipse-mosquitto:2.0.21
    restart: always
    ports:
      - 1883:1883
    volumes:
      # Folder, not single file: a single-file bind mount keeps pointing at
      # the old file after git pull replaces it.
      - ./mosquitto:/mosquitto/config:ro
      - /srv/teslamate/mosquitto/data:/mosquitto/data

  saic2postgresql:
    image: noocyte/saic2postgresql:latest
    container_name: saic2postgresql
    restart: unless-stopped
    depends_on:
      - mosquitto
      - osrm
      - database
    environment:
      - MQTT_BROKER=tcp://mosquitto:1883
      - MQTT_TOPIC_PREFIX=${TESLAMATE_SAIC_TOPIC_PREFIX}
      - DB_URI=${TESLAMATE_SAIC_DB_URI}
      - DRIVE_END_DEBOUNCE_SECONDS=180
      - OSRM_URL=http://osrm:5000

  osrm:
    # Pinned by digest: the preprocessed map data must match the OSRM version.
    image: osrm/osrm-backend@sha256:af5d4a83fb90086a43b1ae2ca22872e6768766ad5fcbb07a29ff90ec644ee409
    restart: unless-stopped
    volumes:
      - /srv/teslamate/osrm-data:/data
    command: osrm-routed --algorithm mld /data/norway-latest.osrm
    ports:
      - "5000:5000"
