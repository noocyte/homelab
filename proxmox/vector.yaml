# Vector on the Proxmox host: forwards the systemd journal to Vector on
# docker-host (compose/victorialogs), which applies the common log schema.
# Installed as /etc/vector/vector.yaml, see README.md → "Logs → VictoriaLogs".
#
# The disk buffer keeps up to 256 MiB of journal while docker-host is down
# (e.g. while it reboots); Vector also remembers its journal position.

data_dir: /var/lib/vector

sources:
  journal:
    type: journald
    # Current boot only: `current_boot_only: false` isn't supported with
    # systemd 250-257 (PVE 9 has 257). The host rarely reboots, so the current
    # boot still covers VictoriaLogs' 30 days on a first start.

sinks:
  docker_host:
    type: vector
    inputs: [journal]
    address: http://192.168.0.240:6000
    # No startup healthcheck: on a host reboot docker-host (a guest here)
    # comes up after Vector, and the failed check (run by `vector validate`
    # in ExecStartPre) stopped Vector for good (2026-11-09). The disk buffer
    # below holds the journal until docker-host answers.
    healthcheck:
      enabled: false
    buffer:
      type: disk
      max_size: 268435488
      when_full: block
