[stack.config]
server = "docker-host"
repo = "noocyte/homelab"
branch = "main"
run_directory = "compose/victoriametrics"
config_files = [
  { path = "scrape.yml", requires = "redeploy" },   # re-read within a minute
  { path = "relabel.yml", requires = "restart" },   # only read at startup
]
# Reload Ofelia's jobs (victoriametrics-backup).
post_deploy.command = "docker restart backup-scheduler || echo 'backup-scheduler not running yet - skipped'"

