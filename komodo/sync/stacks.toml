[[stack]]
name = "teslamate"
deploy = true
tags = ["apps", "gitops"]
[stack.config]
server = "docker-host"
repo = "noocyte/homelab"
branch = "main"
run_directory = "compose/teslamate"
config_files = [
  { path = "dump.sh", requires = "redeploy" },
  # Grafana re-reads its provisioning on restart.
  { path = "grafana/provisioning/dashboards-homelab.yml", requires = "restart", services = ["grafana"] },
  { path = "grafana/provisioning/datasources-homelab.yml", requires = "restart", services = ["grafana"] },
  # Dashboards: Grafana re-reads changed files within a minute; listing them
  # here makes homelab-gitops pull the change.
  { path = "grafana/dashboards/general/visited-all-cars.json", requires = "redeploy", services = ["grafana"] },
  { path = "grafana/dashboards/unifi/client-insights.json", requires = "redeploy", services = ["grafana"] },
  { path = "grafana/dashboards/unifi/network-sites.json", requires = "redeploy", services = ["grafana"] },
  { path = "grafana/dashboards/unifi/uap.json", requires = "redeploy", services = ["grafana"] },
  { path = "grafana/dashboards/unifi/usg.json", requires = "redeploy", services = ["grafana"] },
  { path = "grafana/dashboards/unifi/usw.json", requires = "redeploy", services = ["grafana"] },
  { path = "grafana/dashboards/pihole/pihole-exporter.json", requires = "redeploy", services = ["grafana"] },
]
pre_deploy.path = "."
pre_deploy.command = "test -d /srv/teslamate/custom-dashboards/.git || git clone --depth 1 https://github.com/jheredianet/Teslamate-CustomGrafanaDashboards.git /srv/teslamate/custom-dashboards"
# 1. Restart grafana: its provisioning .yml files are single-file mounts,
#    which keep showing the old file after a git pull until a restart.
#    `compose up` alone doesn't restart it when compose.yaml is unchanged.
# 2. Reload Ofelia's jobs (teslamate-dump). On a fresh rebuild the backup
#    stack may not exist yet; it loads the labels itself when it starts.
post_deploy.command = "docker restart teslamate-grafana-1 && (docker restart backup-scheduler || echo 'backup-scheduler not running yet - skipped')"
environment = """
TESLAMATE_ENCRYPTION_KEY = [[TESLAMATE_ENCRYPTION_KEY]]
TESLAMATE_DB_PASS = [[TESLAMATE_DB_PASS]]
TESLAMATE_TIBBER_TOKEN = [[TESLAMATE_TIBBER_TOKEN]]
TESLAMATE_ABRP_TOKEN = [[TESLAMATE_ABRP_TOKEN]]
TESLAMATE_SAIC_TOPIC_PREFIX = [[TESLAMATE_SAIC_TOPIC_PREFIX]]
TESLAMATE_SAIC_DB_URI = [[TESLAMATE_SAIC_DB_URI]]
"""
