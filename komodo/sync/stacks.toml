tags = ["apps", "gitops"]
[stack.config]
server = "docker-host"
repo = "noocyte/homelab"
branch = "main"
run_directory = "compose/weatherrouter"
# Own image published as :latest - redeploy automatically when it changes.
auto_update = true
environment = """
ROUTER_GOOGLE_API_KEY = [[ROUTER_GOOGLE_API_KEY]]
ROUTER_DATEX_USERNAME = [[ROUTER_DATEX_USERNAME]]
ROUTER_DATEX_PASSWORD = [[ROUTER_DATEX_PASSWORD]]
"""

