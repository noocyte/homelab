# Komodo Stacks: one per folder in compose/.
#
# Secrets are Komodo Variables marked "secret" (Settings → Variables), and are
# interpolated with [[NAME]]. They are never stored in git. The full list is
# in README.md → "Secrets".
#
# tags "gitops"  → homelab-gitops deploys the stack when its files change in
#                  git (procedures.toml). Leave it off for stacks that must
#                  not start yet (crafty).
#
# deploy = true  → the sync deploys the stack if it isn't running or its
#                  config changed.
#
# config_files   → extra files (besides compose.yaml) that the homelab-gitops
#                  procedure (procedures.toml) diffs against the last deploy.
#                  "redeploy" = docker compose up -d: git is pulled, only
#                  containers whose config changed are recreated, and
#                  post_deploy runs.
#
# Ofelia (backup-scheduler) reads the ofelia.* job labels only when it starts.
# Stacks that carry such labels (backup, teslamate) restart it after every
# deploy, so changed schedules/commands are picked up. Ofelia waits for a
# running job before it stops.

[[stack]]
name = "backup"
deploy = true
tags = ["infra", "gitops"]
[stack.config]
server = "docker-host"
repo = "noocyte/homelab"
branch = "main"
run_directory = "compose/backup"
config_files = [
  { path = "backup.sh", requires = "redeploy" },
  { path = "onedrive.sh", requires = "redeploy" },
]
post_deploy.command = "docker restart backup-scheduler"

[[stack]]
name = "pihole"
deploy = true
tags = ["infra", "gitops"]
[stack.config]
server = "docker-host"
repo = "noocyte/homelab"
branch = "main"
run_directory = "compose/pihole"
config_files = [{ path = "lists.sh", requires = "redeploy" }]
environment = """
PIHOLE_ADMIN_PASSWORD = [[PIHOLE_ADMIN_PASSWORD]]
"""
post_deploy.path = "."
post_deploy.command = "sh lists.sh"

